plugins {
	id "com.android.application"
	id "org.jetbrains.kotlin.android"
}


// 获取git提交次数作为版本号
def getGitCommitCount() {
	try {
		def stdout = new ByteArrayOutputStream()
		exec {
			commandLine 'git', 'rev-list', '--count', 'HEAD'
			standardOutput = stdout
		}
		return stdout.toString().trim().toInteger()
	} catch (Exception e) {
		println "无法获取git提交次数，使用默认值: ${e.message}"
		return 100 // 默认值，与原来的versionCode保持一致
	}
}

android {
	namespace 'hu.supercluster.gameoflife'
	compileSdk 36

	defaultConfig {
		applicationId 'hu.supercluster.gameoflife'
		minSdk 14
		targetSdkVersion 36
		versionCode getGitCommitCount()
		versionName "1.0.1"
		multiDexEnabled true

		javaCompileOptions {
			annotationProcessorOptions {
				arguments = [
						'resourcePackageName': "hu.supercluster.gameoflife",
						"androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()
				]
			}
		}
    }

	bundle {
		density { enableSplit true }
		abi { enableSplit true }
		language { enableSplit false }
	}

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name_for_buildtype", "Game of Life (debug)"
            minifyEnabled false
//            testCoverageEnabled = false
        }

        release {
            resValue "string", "app_name_for_buildtype", "Game of Life"
			minifyEnabled true
			shrinkResources true
			debuggable false
			zipAlignEnabled true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
        }
    }

	kotlinOptions { jvmTarget = 17 }
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	buildFeatures {
		viewBinding true
		buildConfig true
	}

    sourceSets.main {
        // src/gen is the target for generated content like json model
        java.srcDirs += 'build/generated/source/db'
    }

    // avoid errors with message 'Duplicate files copied in APK ...'
    packagingOptions {
        exclude 'LICENSE.txt'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.0.2'
	implementation "androidx.multidex:multidex:2.0.1"

	implementation 'com.github.tslamic.adn:library:1.0'
	implementation 'com.jakewharton.timber:timber:5.0.1'
	implementation 'com.squareup:otto:1.3.8'

	implementation "org.androidannotations:androidannotations-api:4.8.0"
	annotationProcessor "org.androidannotations:androidannotations:4.8.0"
}